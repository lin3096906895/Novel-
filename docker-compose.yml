services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: novel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel_password
      POSTGRES_DB: novel_platform
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build:
      context: ./apps/rag-service
    container_name: novel-rag
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://novel:novel_password@postgres:5432/novel_platform
      RAG_PORT: 8000
      INTERNAL_RAG_TOKEN: ${INTERNAL_RAG_TOKEN:-local-dev-rag-token}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-mock}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-mock-1024}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
